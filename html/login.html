<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CARE — Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="login">
    <header class="site-header">
      <a href="index.html" class="brand" aria-label="CARE Home">CARE</a>
      <nav class="main-nav" aria-label="Principal">
        <a href="index.html">Início</a>
        <a href="quem-somos.html" class="requires-guest">Quem somos</a>
        <a href="empresas.html" class="requires-guest">Empresas parceiras</a>
        <a href="seguindo.html" class="requires-auth">Seguindo</a>
        <a href="minhas-pesquisas.html" class="requires-auth">Minhas Pesquisas</a>
        <a href="perfil.html" class="requires-auth">Perfil</a>
        <a href="criacao-de-pesquisa.html" class="requires-auth requires-role-empresa">Criação de pesquisa</a>
        <a href="configuracoes.html" class="requires-auth">Configurações</a>
      </nav>
      <nav class="user-nav" aria-label="Acesso">
        <a class="btn btn-ghost" href="login.html" aria-current="page">Log In</a>
        <a class="btn btn-primary" href="#cadastro" id="abrirCadastro">Cadastrar-se</a>
      </nav>
    </header>

    <main class="container page-shell auth">
      <section class="auth-panel" aria-labelledby="tituloAuth">
        <h1 id="tituloAuth">Acesse sua conta</h1>

        <form class="form" id="formLogin" autocomplete="on">
          <label>
            <span>E-mail</span>
            <input type="email" name="email" placeholder="seu@email.com" required />
          </label>
          <label>
            <span>Senha</span>
            <input type="password" name="password" placeholder="••••••••" required />
          </label>
          <button class="btn btn-primary btn-block" type="submit">Entrar</button>
          <div class="muted small center">
            <span>Não tem uma conta? </span><a href="#cadastro" id="linkCadastro">Cadastre-se</a>
          </div>
        </form>

        <form class="form hidden" id="formCadastro" autocomplete="on">
          <label>
            <span>Nome completo</span>
            <input type="text" name="nome" placeholder="Seu nome" required />
          </label>
          <label>
            <span>E-mail</span>
            <input type="email" name="email" placeholder="seu@email.com" required />
          </label>
          <label>
            <span>Tipo de conta</span>
            <select name="tipo" required>
              <option value="cliente" selected>Cliente</option>
              <option value="empresa">Empresa</option>
            </select>
          </label>
          <label>
            <span>Senha</span>
            <input type="password" name="password" placeholder="Crie uma senha" required />
          </label>
          <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
          <div class="muted small center">
            <span>Já possui conta? </span><a href="#login" id="linkLogin">Entrar</a>
          </div>
        </form>

        <div class="providers">
          <button class="btn btn-ghost btn-block" type="button">Entrar com Google</button>
          <button class="btn btn-ghost btn-block" type="button">Entrar com Facebook</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <small>© <span id="ano"></span> CARE — Todos os direitos reservados.</small>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/app.js"></script>
  </body>
  </html>
