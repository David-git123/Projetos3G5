<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CARE — Criação de pesquisa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="criacao">
    <header class="site-header">
      <a href="index.html" class="brand" aria-label="CARE Home">CARE</a>
      <nav class="main-nav" aria-label="Principal">
        <a href="index.html">Início</a>
        <a href="quem-somos.html" class="requires-guest">Quem somos</a>
        <a href="empresas.html" class="requires-guest">Empresas parceiras</a>
        <a href="seguindo.html" class="requires-auth">Seguindo</a>
        <a href="minhas-pesquisas.html" class="requires-auth">Minhas Pesquisas</a>
        <a href="perfil.html" class="requires-auth">Perfil</a>
        <a href="criacao-de-pesquisa.html" class="requires-auth" aria-current="page">Criação de pesquisa</a>
        <a href="configuracoes.html" class="requires-auth">Configurações</a>
      </nav>
      <nav class="user-nav" aria-label="Acesso"></nav>
    </header>

    <main class="container page-shell">
      <section class="page-title">
        <h1>Criação de pesquisa</h1>
        <p class="muted">Disponível para contas do tipo <strong>Empresa</strong>.</p>
      </section>

      <section class="card" data-show-if="empresa">
        <form class="form" id="formPesquisa">
          <label>
            <span>Título</span>
            <input type="text" name="titulo" placeholder="Título da pesquisa" required />
          </label>
          <label>
            <span>Descrição</span>
            <input type="text" name="descricao" placeholder="Breve descrição" required />
          </label>
          <button type="submit" class="btn btn-primary">Publicar</button>
        </form>
      </section>

      <section class="card" data-show-if="cliente">
        <p class="muted">Esta seção é exclusiva para empresas.</p>
      </section>
    </main>

    <footer class="site-footer">
      <small>© <span id="ano"></span> CARE — Todos os direitos reservados.</small>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/app.js"></script>
  </body>
  </html>
