# Perfil para producao/deploy usando MySQL.
# Defina SPRING_PROFILES_ACTIVE=mysql

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/care_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use scripts/mysql-import.sql para popular com os dados exportados do H2.
