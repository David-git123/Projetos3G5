<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CARE â€” Minhas postagens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="empresa-postagens">
  <header class="site-header empresa-header"><a href="minhas-postagens.html" class="brand" aria-label="CARE Home">CARE</a><nav class="main-nav empresa-nav" aria-label="Principal"><a href="minhas-postagens.html" aria-current="page">Minhas postagens</a>
      <a href="criacao-de-pesquisa.html">Montar pesquisa</a>
    </nav>
    <div class="empresa-user">
      <span class="user-name" data-bind="user-name">Roberto Rodrigues</span>
      <a class="avatar" href="configuracoes.html" title="ConfiguraÃ§Ãµes"></a>
    </div>
  </header>

    <main class="empresa-shell two-cols">
      <aside class="pill-panel">
        <button class="pill" data-filter="ATIVO">Publicadas</button>
        <button class="pill" data-filter="RASCUNHO">Rascunhos</button>
      </aside>

      <section class="survey-list">
        <div id="postagensLoading" class="muted">Carregando postagens...</div>
        <div id="postagensVazia" class="muted" style="display:none;">Nenhuma postagem encontrada.</div>
        <div id="postagensGrid" class="survey-grid" style="display:none;"></div>
      </section>
    </main>

    <section id="destPanel" class="dest-panel" style="display:none;">
      <div class="dest-card">
        <div class="dest-head">
          <h3>DestinatÃ¡rios</h3>
          <button id="destClose" class="btn btn-ghost">Fechar</button>
        </div>
        <p class="muted" id="destInfo">Selecione usuÃ¡rios ou escolha todos.</p>
        <div class="dest-actions">
          <label><input type="checkbox" id="destTodos" /> Selecionar todos</label>
          <div class="client-search" style="width:100%;margin:0;">
            <span class="icon">ðŸ”</span>
            <input type="text" id="destBusca" placeholder="Buscar por nome ou email" />
          </div>
          <button class="btn btn-primary" id="destBuscar">Buscar</button>
        </div>
        <div id="destLista" class="dest-list"></div>
        <div class="dest-footer">
          <button class="btn btn-primary" id="destSalvar">Salvar destinatÃ¡rios</button>
        </div>
        <div id="destMensagem" class="muted" style="display:none;"></div>
      </div>
    </section>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/app.js"></script>
    <script>
      (function(){
        const grid = document.getElementById('postagensGrid');
        const loading = document.getElementById('postagensLoading');
        const vazia = document.getElementById('postagensVazia');
        const pills = document.querySelectorAll('.pill[data-filter]');
        const destPanel = document.getElementById('destPanel');
        const destLista = document.getElementById('destLista');
        const destMsg = document.getElementById('destMensagem');
        const destInfo = document.getElementById('destInfo');
        const destTodos = document.getElementById('destTodos');
        const destBusca = document.getElementById('destBusca');
        let formSelecionado = null;
        let filtro = 'ATIVO';

        async function carregarFormularios() {
          loading.style.display = 'block';
          vazia.style.display = 'none';
          grid.style.display = 'none';
          grid.innerHTML = '';
          try {
            const resp = await fetch('/api/formularios', { credentials:'include' });
            const data = await resp.json();
            loading.style.display = 'none';
            if (!data.success || !data.formularios || data.formularios.length === 0) {
              vazia.style.display = 'block';
              return;
            }
            const filtrados = filtro ? data.formularios.filter(f => (f.status || '').toUpperCase() === filtro) : data.formularios;
            if (filtrados.length === 0) {
              vazia.style.display = 'block';
              return;
            }
            filtrados.forEach(f => {
              const card = document.createElement('div');
              card.className = 'survey-card';
              card.innerHTML = `
                <div class="survey-thumb"></div>
                <h4>${f.titulo || 'Sem tÃ­tulo'}</h4>
                <p class="muted">${f.descricao || 'Sem descriÃ§Ã£o'}</p>
                <small class="muted">Status: ${f.status || 'â€”'}</small>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                  <button class="btn btn-ghost" data-id="${f.id}" data-action="copiar">Copiar link</button>
                  <button class="btn btn-primary" data-id="${f.id}" data-action="dest">DestinatÃ¡rios</button>
                  ${f.status && f.status.toUpperCase() === 'RASCUNHO'
                    ? `<button class="btn btn-primary" data-id="${f.id}" data-action="publicar">Publicar</button>`
                    : `<button class="btn btn-ghost" data-id="${f.id}" data-action="despublicar" style="color:#dc3545;">Remover publicaÃ§Ã£o</button>`}
                </div>
              `;
              grid.appendChild(card);
            });
            grid.style.display = 'grid';
          } catch (e) {
            loading.textContent = 'Erro ao carregar postagens.';
          }
        }

        async function copiarLink(id) {
          const url = `${location.origin}/responder-formulario.html?id=${id}`;
          try {
            await navigator.clipboard.writeText(url);
            alert('Link copiado: ' + url);
          } catch (_) {
            alert('Link: ' + url);
          }
        }

        async function abrirDestinatarios(id, titulo) {
          formSelecionado = id;
          destMsg.style.display = 'none';
          destTodos.checked = false;
          destBusca.value = '';
          destLista.innerHTML = '';
          destInfo.textContent = `Selecione destinatÃ¡rios para "${titulo || 'formulÃ¡rio'}"`;
          destPanel.style.display = 'block';
          await buscarUsuarios();
          await marcarDestinatariosSalvos();
        }

        async function buscarUsuarios() {
          destLista.innerHTML = '<p class="muted">Carregando...</p>';
          const q = destBusca.value.trim();
          const resp = await fetch('/api/usuarios' + (q ? `?q=${encodeURIComponent(q)}` : ''), { credentials:'include' });
          const data = await resp.json();
          if (!data.success) {
            destLista.innerHTML = '<p class="muted">Erro ao buscar usuÃ¡rios.</p>';
            return;
          }
          const usuarios = data.usuarios || [];
          if (usuarios.length === 0) {
            destLista.innerHTML = '<p class="muted">Nenhum usuÃ¡rio encontrado.</p>';
            return;
          }
          destLista.innerHTML = usuarios.map(u => `
            <label class="dest-item">
              <input type="checkbox" value="${u.id}" class="dest-check" />
              <span>${u.nome} â€” ${u.email}</span>
            </label>
          `).join('');
        }

        async function marcarDestinatariosSalvos() {
          if (!formSelecionado) return;
          try {
            const resp = await fetch(`/api/formularios/${formSelecionado}/destinatarios`, { credentials:'include' });
            const data = await resp.json();
            if (!data.success || !data.destinatarios) return;
            const ids = data.destinatarios.map(d => Number(d.usuarioId));
            document.querySelectorAll('.dest-check').forEach(cb => {
              cb.checked = ids.includes(Number(cb.value));
            });
          } catch (_) { /* ignore */ }
        }

        async function salvarDestinatarios() {
          if (!formSelecionado) return;
          const selecionados = Array.from(document.querySelectorAll('.dest-check:checked')).map(c => Number(c.value));
          const body = {
            selecionarTodos: destTodos.checked,
            usuarioIds: selecionados
          };
          destMsg.style.display = 'none';
          try {
            const resp = await fetch(`/api/formularios/${formSelecionado}/destinatarios`, {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              credentials:'include',
              body: JSON.stringify(body)
            });
            const data = await resp.json();
            destMsg.style.display = 'block';
            destMsg.textContent = data.success ? 'DestinatÃ¡rios atualizados.' : (data.message || 'Erro ao salvar.');
          } catch (e) {
            destMsg.style.display = 'block';
            destMsg.textContent = 'Erro ao salvar destinatÃ¡rios.';
          }
        }

        async function atualizarStatus(id, status) {
          const resp = await fetch(`/api/formularios/${id}`, {
            method:'PUT',
            headers:{'Content-Type':'application/json'},
            credentials:'include',
            body: JSON.stringify({ status })
          });
          const data = await resp.json();
          alert(data.message || (data.success ? 'Status atualizado.' : 'Erro ao atualizar.'));
          carregarFormularios();
        }

        async function despublicar(id) {
          const resp = await fetch(`/api/formularios/${id}/despublicar`, {
            method:'POST',
            credentials:'include'
          });
          const data = await resp.json();
          alert(data.message || (data.success ? 'Removida a publicaÃ§Ã£o.' : 'Erro ao despublicar.'));
          carregarFormularios();
        }

        grid?.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-action]');
          if (!btn) return;
          const id = btn.getAttribute('data-id');
          const action = btn.getAttribute('data-action');
          const title = btn.closest('.survey-card')?.querySelector('h4')?.textContent || '';
          if (action === 'copiar') copiarLink(id);
          if (action === 'dest') abrirDestinatarios(id, title);
          if (action === 'publicar') atualizarStatus(id, 'ATIVO');
          if (action === 'despublicar') despublicar(id);
        });

        function setFiltro(filter) {
          filtro = filter;
          pills.forEach(p => p.classList.remove('active'));
          const btn = document.querySelector(`.pill[data-filter="${filter}"]`);
          if (btn) btn.classList.add('active');
          carregarFormularios();
        }

        pills.forEach(p => {
          p.addEventListener('click', () => setFiltro(p.getAttribute('data-filter')));
        });

        document.getElementById('destClose')?.addEventListener('click', () => destPanel.style.display = 'none');
        document.getElementById('destBuscar')?.addEventListener('click', buscarUsuarios);
        document.getElementById('destSalvar')?.addEventListener('click', salvarDestinatarios);

        setFiltro('ATIVO');
      })();
    </script>
  </body>
</html>
