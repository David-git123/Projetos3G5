<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CARE — Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      body[data-page="cadastro"] {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        background: #59a9ff url('assets/img/fundo-login.png') center center / cover no-repeat;
      }
      main.cadastro-fill {
        flex: 1;
        display: grid;
        align-items: center;
        justify-items: end;
        padding: 24px 32px 36px;
      }
      .cadastro-wrapper {
        width: min(86vw, 440px);
        background: #dcdcdc;
        border-radius: 26px;
        box-shadow: 0 18px 34px rgba(0, 0, 0, 0.22);
        overflow: hidden;
        display: grid;
        gap: 0;
      }
      .auth-tabs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        background: linear-gradient(135deg, #0b2f7a 0%, #123d9c 50%, #0b2f7a 100%);
        color: #fff;
      }
      .auth-tabs a {
        padding: 16px 12px;
        text-align: center;
        color: #fff;
        font-size: 1.25rem;
        font-weight: 800;
        text-decoration: none;
        opacity: 0.8;
      }
      .auth-tabs a.active {
        opacity: 1;
      }
      .auth-card {
        padding: 26px 26px 30px;
        display: grid;
        gap: 18px;
      }
      .form {
        display: grid;
        gap: 18px;
      }
      .form label {
        display: grid;
        gap: 8px;
        font-size: 1.2rem;
        font-weight: 700;
        color: #1a1a1a;
      }
      .form input {
        border: none;
        background: #fdfdfd;
        padding: 16px 18px;
        border-radius: 18px;
        font-size: 1rem;
        box-shadow: inset 0 0 0 1px #e1e1e1;
      }
      .btn-primary {
        background: #1f7ae5;
        border: none;
        color: #fff;
        font-weight: 800;
        font-size: 1.05rem;
        padding: 14px;
        border-radius: 20px;
        box-shadow: 0 12px 20px rgba(31, 122, 229, 0.35);
      }
    </style>
  </head>
  <body data-page="cadastro" class="login-bg-cadastro">
    <header class="site-header site-header-full"><a href="index.html" class="brand" aria-label="CARE Home">CARE</a><nav class="main-nav" aria-label="Principal"><a href="index.html">Início</a><a href="quem-somos.html" class="requires-guest">Quem somos</a>
        <a href="empresas.html" class="requires-guest">Empresas parceiras</a>
        <a href="seguindo.html" class="requires-auth requires-role-cliente">Seguindo</a>
        <a href="minhas-pesquisas.html" class="requires-auth requires-role-cliente">Minhas Pesquisas</a>
        <a href="minhas-postagens.html" class="requires-auth requires-role-empresa">Minhas postagens</a>
        <a href="criacao-de-pesquisa.html" class="requires-auth requires-role-empresa">Montar pesquisa</a>
        <a href="login.html" class="requires-guest">Login</a>
      </nav>
      <nav class="user-nav" aria-label="Acesso"></nav>
    </header>

    <main class="cadastro-fill">
      <section class="cadastro-wrapper" aria-labelledby="tituloCadastro">
        <div class="auth-tabs">
          <a href="login.html">Log in</a>
          <a class="active" href="cadastro.html">Cadastre-se</a>
        </div>
        <div class="auth-card">
          <h1 id="tituloCadastro" class="visually-hidden">Cadastro</h1>
          <form class="form" id="formCadastro" autocomplete="on">
            <label>
              <span>Nome completo</span>
              <input type="text" name="nome" placeholder="Seu nome" required />
            </label>
            <label>
              <span>E-mail</span>
              <input type="email" name="email" placeholder="seu@email.com" required />
            </label>
            <label>
              <span>Senha</span>
              <input type="password" name="password" placeholder="Crie uma senha" required />
            </label>
            <label>
              <span>Confirmar senha</span>
              <input type="password" name="confirmPassword" placeholder="Repita a senha" required />
            </label>
            <input type="hidden" name="tipo" value="cliente" />
            <button class="btn btn-primary btn-block" type="submit">Cadastrar</button>
          </form>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/app.js"></script>
  </body>
</html>
