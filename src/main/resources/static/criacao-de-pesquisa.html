<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CARE — Montar pesquisa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      /* Visual alinhado ao protótipo "Montar pesquisa" */
      body[data-page="empresa-montar"] {
        background: #d6d9df;
      }
      body[data-page="empresa-montar"] .site-header {
        position: static;
        width: min(1200px, calc(100% - 32px));
        margin: 18px auto 0;
        border-radius: 12px 12px 0 0;
        border: 1px solid #d5d5d5;
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.18);
        background: #ffffff;
        padding: 14px 22px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 24px;
      }
      body[data-page="empresa-montar"] .brand {
        background: url('assets/logo-horizontal.png') no-repeat left center / contain;
        width: 180px;
        height: 48px;
        text-indent: -9999px;
      }
      body[data-page="empresa-montar"] .main-nav {
        justify-content: center;
        gap: 26px;
      }
      body[data-page="empresa-montar"] .main-nav a {
        color: #7a7a7a;
        font-weight: 700;
        background: none;
        border: none;
        box-shadow: none;
        padding: 10px 6px;
      }
      body[data-page="empresa-montar"] .main-nav a[aria-current="page"] {
        color: #3b9cf3;
      }
      .montar-user {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        color: #0f172a;
      }
      .montar-user .avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f1f1f1, #d9d9d9);
        border: 2px solid #ffffff;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.16);
      }
      .montar-shell {
        max-width: 1200px;
        margin: 0 auto 38px;
        background: #c7ddf7;
        border: 1px solid #d5d5d5;
        border-top: none;
        border-radius: 0 0 12px 12px;
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.18);
        padding: 28px 24px 40px;
        display: grid;
        grid-template-columns: minmax(260px, 320px) 1fr;
        gap: 36px;
      }
      .montar-menu {
        background: #ffffff;
        border-radius: 14px;
        padding: 18px 16px;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.15);
        border: 1px solid #e1e1e1;
        display: grid;
        gap: 14px;
      }
      .montar-menu .menu-btn {
        width: 100%;
        text-align: left;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 12px;
        border-radius: 12px;
        border: none;
        background: #f2f2f2;
        font-weight: 800;
        color: #1d1d1d;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
      }
      .montar-menu .menu-btn.active {
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
        background: #ffffff;
      }
      .montar-menu .menu-icon {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: #1f1f1f;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-weight: 900;
      }
      .survey-list {
        align-self: start;
        display: grid;
        gap: 18px;
      }
      .survey-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 32px 22px;
      }
      .survey-card {
        display: grid;
        gap: 10px;
        background: transparent;
        border: none;
        box-shadow: none;
      }
      .survey-card .survey-thumb {
        width: 120px;
        height: 120px;
        border-radius: 8px;
        background: #cfcfcf;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.16);
      }
      .survey-card h4 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }
      .survey-card p {
        margin: 0;
        color: #0f172a;
        font-weight: 600;
        line-height: 1.3;
      }
      @media (max-width: 900px) {
        .montar-shell {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-page="empresa-montar">
    <header class="site-header empresa-header">
      <a href="empresa-home.html" class="brand" aria-label="CARE Home">CARE</a>
      <nav class="main-nav empresa-nav" aria-label="Principal">
      <a href="empresa-home.html">Início</a>
      <a href="minhas-postagens.html">Minhas postagens</a>
      <a href="criacao-de-pesquisa.html" aria-current="page">Montar pesquisa</a>
    </nav>
    <div class="empresa-user">
      <span class="user-name" data-bind="user-name">Roberto Rodrigues</span>
      <a class="avatar" href="configuracoes.html" title="Configurações"></a>
    </div>
  </header>

    <main class="montar-shell">
      <aside class="montar-menu">
        <button class="menu-btn active" id="btnCriar" data-view="criar">
          <span class="menu-icon">■</span>
          Criar nova pesquisa
        </button>
        <button class="menu-btn" id="btnListar" data-view="listar">
          <span class="menu-icon">■</span>
          Pesquisas criadas
        </button>
        <button class="menu-btn" id="btnDeletadas" data-view="deletadas">
          <span class="menu-icon">■</span>
          Pesquisas deletadas
        </button>
      </aside>

      <section class="survey-list">
        <article class="card" id="panelCriar">
          <h3>Nova pesquisa</h3>
          <form class="form" id="formNovaPesquisa">
            <label>
              <span>Título</span>
              <input type="text" id="novoTitulo" placeholder="Nome da pesquisa" required />
            </label>
            <label>
              <span>Descrição</span>
              <textarea id="novaDescricao" rows="3" placeholder="Descreva o objetivo"></textarea>
            </label>
            <button class="btn btn-primary" type="submit">Criar</button>
            <div id="novaMsg" class="muted" style="display:none;"></div>
          </form>
        </article>
        <div id="panelListar">
          <div id="montarLoading" class="muted" style="display:none;">Carregando...</div>
          <div id="montarVazio" class="muted" style="display:none;">Nenhuma pesquisa encontrada.</div>
          <div id="montarGrid" class="survey-grid" style="display:none;"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <small>© <span id="ano"></span> CARE — Todos os direitos reservados.</small>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/app.js"></script>
    <script>
      (function(){
        const loading = document.getElementById('montarLoading');
        const vazio = document.getElementById('montarVazio');
        const grid = document.getElementById('montarGrid');
        const btnCriar = document.getElementById('btnCriar');
        const btnListar = document.getElementById('btnListar');
        const btnDeletadas = document.getElementById('btnDeletadas');
        const formNova = document.getElementById('formNovaPesquisa');
        const novoTitulo = document.getElementById('novoTitulo');
        const novaDescricao = document.getElementById('novaDescricao');
        const novaMsg = document.getElementById('novaMsg');
        const panelCriar = document.getElementById('panelCriar');
        const panelListar = document.getElementById('panelListar');
        let filtro = null;
        let view = 'criar';

        async function criar(titulo, descricao) {
          novaMsg.style.display = 'none';
          const resp = await fetch('/api/formularios', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            credentials:'include',
            body: JSON.stringify({ titulo, descricao })
          });
          const data = await resp.json();
          if (data.success) {
            novaMsg.style.display = 'block';
            novaMsg.textContent = 'Pesquisa criada.';
            formNova.reset();
            listar();
          } else {
            novaMsg.style.display = 'block';
            novaMsg.textContent = data.message || 'Erro ao criar.';
          }
        }

        async function listar() {
          loading.style.display = 'block';
          vazio.style.display = 'none';
          grid.style.display = 'none';
          grid.innerHTML = '';
          try {
            const resp = await fetch('/api/formularios', { credentials:'include' });
            const data = await resp.json();
            loading.style.display = 'none';
            if (!data.success || !data.formularios || data.formularios.length === 0) {
              vazio.style.display = 'block';
              return;
            }
            let filtrados = data.formularios;
            if (view === 'listar') {
              filtrados = filtrados.filter(f => (f.status || '').toUpperCase() !== 'INATIVO');
            } else if (view === 'deletadas') {
              filtrados = filtrados.filter(f => (f.status || '').toUpperCase() === 'INATIVO');
            }
            if (filtrados.length === 0) {
              vazio.style.display = 'block';
              return;
            }
            grid.style.display = 'grid';
            grid.innerHTML = filtrados.map(f => `
              <div class="survey-card">
                <div class="survey-thumb"></div>
                <div>
                  <h4>${escapeHtml(f.titulo || 'Sem título')}</h4>
                  <p class="muted">${escapeHtml(f.descricao || 'Sem descrição')}</p>
                  <small class="muted">Status: ${f.status || '—'}</small>
                  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                    ${view !== 'deletadas' ? `<a class="btn btn-primary" href="editar-pesquisa.html?id=${f.id}">Editar</a>` : ''}
                    ${view === 'deletadas'
                      ? `<button class="btn btn-primary" data-id="${f.id}" data-action="recuperar">Recuperar</button>
                          <button class="btn btn-ghost" data-id="${f.id}" data-action="deletar" style="color:#dc3545;">Excluir definitivamente</button>`
                      : `<button class="btn btn-ghost" data-id="${f.id}" data-action="deletar" style="color:#dc3545;">Excluir</button>`}
                  </div>
                </div>
              </div>
            `).join('');
          } catch (e) {
            loading.style.display = 'none';
            vazio.style.display = 'block';
            vazio.textContent = 'Erro ao carregar.';
          }
        }

        async function remover(id) {
          if (view === 'deletadas') {
            if (!confirm('Excluir definitivamente esta pesquisa?')) return;
          } else {
            if (!confirm('Enviar para deletadas?')) return;
          }
          const resp = await fetch(`/api/formularios/${id}`, { method:'DELETE', credentials:'include' });
          const data = await resp.json();
          alert(data.message || (data.success ? 'Excluída.' : 'Erro ao excluir.'));
          listar();
        }

        async function recuperar(id) {
          const resp = await fetch(`/api/formularios/${id}/recuperar`, {
            method:'POST',
            credentials:'include'
          });
          const data = await resp.json();
          alert(data.message || (data.success ? 'Recuperada para rascunho.' : 'Erro ao recuperar.'));
          listar();
        }

        grid?.addEventListener('click', async (e) => {
          const btn = e.target.closest('button[data-action]');
          if (!btn) return;
          const id = btn.getAttribute('data-id');
          const action = btn.getAttribute('data-action');
          if (action === 'deletar') await remover(id);
          if (action === 'recuperar') await recuperar(id);
        });

        function setView(newView) {
          view = newView;
          [btnCriar, btnListar, btnDeletadas].forEach(btn => btn.classList.remove('active'));
          if (view === 'criar') btnCriar.classList.add('active');
          if (view === 'listar') btnListar.classList.add('active');
          if (view === 'deletadas') btnDeletadas.classList.add('active');
          panelCriar.style.display = view === 'criar' ? 'block' : 'none';
          panelListar.style.display = view === 'criar' ? 'none' : 'block';
          if (view !== 'criar') listar();
        }

        btnCriar?.addEventListener('click', () => setView('criar'));
        btnListar?.addEventListener('click', () => setView('listar'));
        btnDeletadas?.addEventListener('click', () => setView('deletadas'));

        formNova?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const titulo = novoTitulo.value.trim();
          const descricao = novaDescricao.value.trim();
          if (!titulo) {
            novaMsg.style.display = 'block';
            novaMsg.textContent = 'Informe um título.';
            return;
          }
          await criar(titulo, descricao);
        });

        function escapeHtml(text) {
          const div = document.createElement('div');
          div.textContent = text;
          return div.innerHTML;
        }

        setView('criar');
      })();
    </script>
  </body>
</html>
