<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responder pesquisa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="responder">
    <main class="responder-shell">
      <section class="responder-card">
        <h1 id="respTitulo">Carregando...</h1>
        <p id="respDescricao" class="muted"></p>
        <form id="respForm" class="form">
          <div id="respPerguntas"></div>
          <label id="respEmailRow" style="display:none;">
            <span>E-mail (opcional)</span>
            <input type="email" id="respEmail" placeholder="seu@email.com" />
          </label>
          <button type="submit" class="btn btn-primary" id="respEnviar">Enviar respostas</button>
          <div id="respMensagem" class="muted" style="display:none; margin-top:8px;"></div>
        </form>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/app.js"></script>
    <script>
      (function(){
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        const perguntasEl = document.getElementById('respPerguntas');
        const tituloEl = document.getElementById('respTitulo');
        const descEl = document.getElementById('respDescricao');
        const msgEl = document.getElementById('respMensagem');
        const form = document.getElementById('respForm');
        const emailRow = document.getElementById('respEmailRow');

        async function carregarFormulario() {
          if (!id) {
            tituloEl.textContent = 'Formulário não encontrado';
            return;
          }
          const resp = await fetch(`/api/formularios/public/${id}`, { credentials:'include' });
          const data = await resp.json();
          if (!data.success || !data.formulario) {
            tituloEl.textContent = 'Formulário indisponível';
            return;
          }
          const f = data.formulario;
          tituloEl.textContent = f.titulo || 'Formulário';
          descEl.textContent = f.descricao || '';
          const perguntas = f.perguntas || [];
          if (perguntas.length === 0) {
            perguntasEl.innerHTML = '<p class="muted">Este formulário não possui perguntas.</p>';
          } else {
            perguntasEl.innerHTML = perguntas.map((p, idx) => `
              <label>
                <span>${idx+1}. ${p.texto}</span>
                <input type="text" data-pergunta="${p.id}" placeholder="Sua resposta" />
              </label>
            `).join('');
          }
          // Se não há usuário logado, mostrar campo de email opcional
          const u = JSON.parse(localStorage.getItem('care:user') || 'null');
          if (!u) emailRow.style.display = 'grid';
        }

        form?.addEventListener('submit', async (e) => {
          e.preventDefault();
          msgEl.style.display = 'none';
          const respostas = [];
          document.querySelectorAll('input[data-pergunta]').forEach(inp => {
            respostas.push({ id: Number(inp.getAttribute('data-pergunta')), resposta: inp.value });
          });
          const payload = {
            respostasJson: JSON.stringify(respostas),
            email: document.getElementById('respEmail').value || null
          };
          const btn = document.getElementById('respEnviar');
          const txt = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Enviando...';
          try {
            const resp = await fetch(`/api/formularios/public/${id}/respostas`, {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              credentials:'include',
              body: JSON.stringify(payload)
            });
            const data = await resp.json();
            msgEl.style.display = 'block';
            msgEl.textContent = data.message || (data.success ? 'Resposta registrada.' : 'Erro ao enviar.');
          } catch (err) {
            msgEl.style.display = 'block';
            msgEl.textContent = 'Erro ao enviar.';
          } finally {
            btn.disabled = false;
            btn.textContent = txt;
          }
        });

        carregarFormulario();
      })();
    </script>
  </body>
</html>
