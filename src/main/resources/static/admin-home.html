<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CARE — Administração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      body[data-page="admin-home"] {
        margin: 0;
        background: #e5f1ff;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        color: #0f172a;
      }
      .admin-wrap {
        width: 100%;
        min-height: calc(100vh - 130px);
        display: grid;
        place-items: center;
        padding: 28px 16px 40px;
        box-sizing: border-box;
      }
      .admin-card {
        width: min(1080px, 100%);
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 16px 28px rgba(0, 0, 0, 0.16);
        padding: 24px 22px;
        display: grid;
        gap: 18px;
      }
      .admin-card h1 {
        margin: 0;
        font-size: 1.35rem;
      }
      .list-usuarios table {
        width: 100%;
        border-collapse: collapse;
      }
      .list-usuarios th,
      .list-usuarios td {
        padding: 12px 14px;
        border-bottom: 1px solid #e8e8e8;
        text-align: left;
      }
      .list-usuarios th {
        background: #f7f9fc;
        font-weight: 800;
      }
      .row-selectable {
        cursor: pointer;
      }
      .row-selectable:hover {
        background: #f1f5f9;
      }
      .badge-role {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.85rem;
        background: #e2e8f0;
        color: #0f172a;
      }
      .badge-role.empresa { background: #dbeafe; color: #1d4ed8; }
      .badge-role.cliente { background: #dcfce7; color: #166534; }
      .badge-role.admin { background: #fee2e2; color: #b91c1c; }
      .form-admin {
        display: grid;
        gap: 12px;
      }
      .form-admin input {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #d3d3d3;
        background: #f7f7f7;
      }
      .form-admin button {
        background: #1f7ae5;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        font-weight: 800;
        box-shadow: 0 12px 18px rgba(31, 122, 229, 0.35);
        cursor: pointer;
      }
      .feedback {
        display: none;
        font-weight: 700;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .actions button {
        background: #1f7ae5;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 800;
        box-shadow: 0 10px 16px rgba(31, 122, 229, 0.3);
        cursor: pointer;
      }
      .actions button.secondary {
        background: #0f172a;
      }
      .actions button.danger {
        background: #b91c1c;
      }
    </style>
  </head>
  <body data-page="admin-home">
    <header class="site-header empresa-header">
      <a href="admin-home.html" class="brand" aria-label="CARE Home">CARE</a>
      <nav class="main-nav empresa-nav" aria-label="Principal">
        <a href="admin-home.html" aria-current="page">Início</a>
        <a href="minhas-postagens.html">Minhas postagens</a>
        <a href="criacao-de-pesquisa.html">Montar pesquisa</a>
      </nav>
      <div class="empresa-user">
        <span class="user-name" data-bind="user-name">Super</span>
        <a class="avatar" href="configuracoes.html" title="Configurações"></a>
      </div>
    </header>

    <main class="admin-wrap">
      <section class="admin-card">
        <h1>Promover usuário para empresa</h1>
        <div class="list-usuarios">
          <table aria-label="Usuários cadastrados">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Papel</th>
              </tr>
            </thead>
            <tbody id="tabelaUsuarios"></tbody>
          </table>
        </div>

        <form class="form-admin" id="formPromover">
          <label>
            E-mail do usuário
            <input type="email" name="email" id="emailSelecionado" placeholder="usuario@dominio.com" required />
          </label>
          <label>
            Nome da empresa
            <input type="text" name="empresa" id="empresaSelecionada" placeholder="Nome da empresa" required />
          </label>
          <button type="submit">Promover</button>
          <div class="feedback" id="msgPromover"></div>
          <div class="actions" id="acoesUsuario" style="display:none;">
            <button type="button" class="secondary" id="btnDespromover">Despromover usuário</button>
            <button type="button" class="danger" id="btnApagar">Apagar usuário</button>
          </div>
        </form>
      </section>
    </main>

    <script src="assets/app.js"></script>
    <script>
      (function() {
        const form = document.getElementById('formPromover');
        const msg = document.getElementById('msgPromover');
        const tabela = document.getElementById('tabelaUsuarios');
        const emailInput = document.getElementById('emailSelecionado');
        const empresaInput = document.getElementById('empresaSelecionada');
        const acoes = document.getElementById('acoesUsuario');
        const btnDespromover = document.getElementById('btnDespromover');
        const btnApagar = document.getElementById('btnApagar');
        if (!form || !msg || !tabela) return;

        let usuarios = [];

        function escapeHtml(text) {
          const div = document.createElement('div');
          div.textContent = text;
          return div.innerHTML;
        }

        function renderTabela(dados) {
          if (!dados.length) {
            tabela.innerHTML = '<tr><td colspan="3">Nenhum usuário encontrado.</td></tr>';
            return;
          }
          tabela.innerHTML = dados.map(u => {
            const role = (u.role || 'cliente').toLowerCase();
            const badgeClass = role === 'empresa' ? 'empresa' : role === 'administrador' ? 'admin' : 'cliente';
            const empresaNome = u.empresa || '';
            return `
              <tr class="row-selectable" data-email="${escapeHtml(u.email || '')}" data-empresa="${escapeHtml(empresaNome)}" data-role="${escapeHtml(role)}">
                <td>${escapeHtml(u.nome || '—')}</td>
                <td>${escapeHtml(u.email || '')}</td>
                <td><span class="badge-role ${badgeClass}">${escapeHtml(role)}</span></td>
              </tr>
            `;
          }).join('');
          tabela.querySelectorAll('.row-selectable').forEach(tr => {
            tr.addEventListener('click', () => {
              tabela.querySelectorAll('.row-selectable').forEach(r => r.classList.remove('active'));
              tr.classList.add('active');
              emailInput.value = tr.dataset.email || '';
              empresaInput.value = tr.dataset.empresa || '';
              if (acoes) acoes.style.display = 'flex';
            });
          });
        }

        async function carregarUsuarios() {
          try {
            const resp = await fetch('/api/admin/usuarios', { credentials: 'include' });
            const data = await resp.json();
            if (!data.success) throw new Error(data.message || 'Falha ao carregar');
            usuarios = data.usuarios || [];
            renderTabela(usuarios);
          } catch (err) {
            tabela.innerHTML = `<tr><td colspan="3">Erro ao carregar usuários. ${err.message || ''}</td></tr>`;
            usuarios = [];
          }
        }

        async function promover(email, empresa) {
          const resp = await fetch('/api/admin/promover-empresa', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, empresa })
          });
          const data = await resp.json();
          if (!data.success) throw new Error(data.message || 'Erro ao promover');
          return data.user;
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = emailInput.value.trim();
          const empresa = empresaInput.value.trim();
          if (!email || !empresa) return;
          try {
            const user = await promover(email, empresa);
            const idx = usuarios.findIndex(u => u.email === email);
            if (idx >= 0) usuarios[idx] = user; else usuarios.push(user);
            msg.textContent = 'Usuário promovido para empresa.';
            msg.style.color = '#155724';
            msg.style.display = 'block';
            renderTabela(usuarios);
          } catch (err) {
            msg.textContent = err.message || 'Erro ao promover.';
            msg.style.color = '#b00020';
            msg.style.display = 'block';
          }
        });

        btnDespromover?.addEventListener('click', async () => {
          const email = emailInput.value.trim();
          if (!email) return;
          try {
            const user = await despromover(email);
            const idx = usuarios.findIndex(u => u.email === email);
            if (idx >= 0) usuarios[idx] = user; else usuarios.push(user);
            msg.textContent = 'Usuário despromovido para cliente.';
            msg.style.color = '#155724';
            msg.style.display = 'block';
            renderTabela(usuarios);
          } catch (err) {
            msg.textContent = err.message || 'Erro ao despromover.';
            msg.style.color = '#b00020';
            msg.style.display = 'block';
          }
        });

        btnApagar?.addEventListener('click', async () => {
          const email = emailInput.value.trim();
          if (!email) return;
          try {
            const ok = await apagar(email);
            if (ok) {
              usuarios = usuarios.filter(u => u.email !== email);
              emailInput.value = '';
              empresaInput.value = '';
              if (acoes) acoes.style.display = 'none';
              msg.textContent = 'Usuário removido.';
              msg.style.color = '#155724';
              msg.style.display = 'block';
              renderTabela(usuarios);
            }
          } catch (err) {
            msg.textContent = err.message || 'Erro ao remover.';
            msg.style.color = '#b00020';
            msg.style.display = 'block';
          }
        });

        carregarUsuarios();
      })();
    </script>
  </body>
</html>
