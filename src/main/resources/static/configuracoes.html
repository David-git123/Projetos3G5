<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CARE — Configurações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      /* Visual para a suíte de configurações (temas, privacidade, info, ajuda) */
      body[data-page="config"] {
        background: #d6d9df;
      }
      body[data-page="config"] .site-header {
        position: static;
        width: min(1200px, calc(100% - 32px));
        margin: 18px auto 0;
        border-radius: 12px 12px 0 0;
        border: 1px solid #d5d5d5;
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.18);
        background: #ffffff;
        padding: 14px 22px;
      }
      .config-shell {
        max-width: 1200px;
        margin: 0 auto 38px;
        background: #c7ddf7;
        border: 1px solid #d5d5d5;
        border-top: none;
        border-radius: 0 0 12px 12px;
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.18);
        padding: 28px 24px 40px;
        display: grid;
        grid-template-columns: minmax(260px, 320px) 1fr;
        gap: 36px;
      }
      .profile-panel {
        background: #ffffff;
        border-radius: 14px;
        padding: 20px 16px;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.15);
        border: 1px solid #e1e1e1;
      }
      .profile-avatar {
        background: linear-gradient(135deg, #f1f1f1, #d9d9d9);
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.16);
      }
      .profile-menu a {
        display: block;
        background: #f2f2f2;
        padding: 12px;
        border-radius: 12px;
        margin-top: 10px;
        font-weight: 800;
        color: #1d1d1d;
        text-decoration: none;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
      }
      .profile-menu a.active {
        background: #ffffff;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
      }
      .profile-details {
        background: #ffffff;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.15);
        border: 1px solid #e1e1e1;
      }
      .profile-field input,
      .profile-field textarea {
        background: #f5f5f5;
        border-radius: 12px;
        border: 1px solid #d3d3d3;
      }
      .profile-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .profile-actions .btn-primary {
        background: #0b7adf;
        border-radius: 999px;
        box-shadow: 0 10px 18px rgba(11, 122, 223, 0.35);
        border: 1px solid #0b6eca;
      }
      @media (max-width: 900px) {
        .config-shell {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-page="config">
    <header class="site-header config-header">
      <a href="index.html" class="brand" aria-label="CARE Home">CARE</a>

      <!-- Header para cliente -->
      <nav class="main-nav cliente-nav requires-role-cliente" aria-label="Principal">
        <a href="cliente-home.html">Início</a>
        <a href="seguindo.html">Seguindo</a>
        <a href="minhas-pesquisas.html">Minhas pesquisas</a>
      </nav>

      <!-- Header para empresa -->
      <nav class="main-nav empresa-nav requires-role-empresa" aria-label="Principal">
        <a href="empresa-home.html">Início</a>
        <a href="minhas-postagens.html">Minhas postagens</a>
        <a href="criacao-de-pesquisa.html">Montar pesquisa</a>
      </nav>

      <div class="cliente-user requires-role-cliente">
        <span class="user-name" data-bind="user-name">Késia Carvalho</span>
        <a class="avatar" href="configuracoes.html" title="Configurações"></a>
      </div>
      <div class="empresa-user requires-role-empresa">
        <span class="user-name" data-bind="user-name">Roberto Rodrigues</span>
        <a class="avatar" href="configuracoes.html" title="Configurações"></a>
      </div>
    </header>

    <main class="config-shell">
      <aside class="profile-panel">
        <div class="profile-avatar"></div>
        <div class="profile-name" data-bind="user-name">Késia Carvalho</div>
        <small class="muted">Configurações</small>
        <nav class="profile-menu">
        <a class="active" href="#info">Informações pessoais</a>
        <a href="#temas">Opções de temas</a>
        <a href="#privacidade">Privacidade</a>
        <button type="button" class="menu-btn-link" id="btnAjudaDummy">Ajuda</button>
        <a href="#" id="linkSair" style="color:#dc3545;">Sair</a>
      </nav>
      </aside>

      <section class="profile-details">
        <div class="profile-header">
          <div class="profile-avatar small"></div>
          <div>
            <div class="muted">Avatar</div>
            <small class="muted">Para mudar o avatar, clique no ícone ao lado do círculo</small>
          </div>
        </div>

        <div class="profile-field">
          <label for="nomePerfil">Nome</label>
          <input id="nomePerfil" type="text" value="Késia Carvalho" />
        </div>
        <div class="profile-field">
          <label for="bioPerfil">Bio</label>
          <textarea id="bioPerfil" rows="3">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</textarea>
        </div>
        <div class="profile-actions">
          <button class="btn btn-primary" type="button">Salvar alterações</button>
          <button class="btn btn-ghost" type="button">Cancelar</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <small>© <span id="ano"></span> CARE — Todos os direitos reservados.</small>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/app.js"></script>
    <script>
      // Alterar senha
      (function() {
        const formSenha = document.getElementById('formSenha');
        const mensagemSenha = document.getElementById('mensagemSenha');
        
        if (formSenha) {
          formSenha.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const senhaAtual = document.getElementById('senhaAtual').value;
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;
            const btnSalvar = document.getElementById('btnSalvarSenha');
            
            if (novaSenha.length < 6) {
              mostrarMensagem('A nova senha deve ter pelo menos 6 caracteres.', 'error');
              return;
            }
            
            if (novaSenha !== confirmarSenha) {
              mostrarMensagem('As senhas não coincidem.', 'error');
              return;
            }
            
            const originalText = btnSalvar.textContent;
            btnSalvar.disabled = true;
            btnSalvar.textContent = 'Alterando...';
            
            try {
              // Primeiro, verificar senha atual fazendo login
              const user = JSON.parse(localStorage.getItem('care:user') || '{}');
              
              const responseLogin = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email: user.email, password: senhaAtual })
              });
              
              const dataLogin = await responseLogin.json();
              
              if (!dataLogin.success) {
                mostrarMensagem('Senha atual incorreta.', 'error');
                btnSalvar.disabled = false;
                btnSalvar.textContent = originalText;
                return;
              }
              
              // Alterar senha
              const responseSenha = await fetch('/api/auth/user/password', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ senhaAtual, novaSenha })
              });
              
              const dataSenha = await responseSenha.json();
              
              if (dataSenha.success) {
                mostrarMensagem('Senha alterada com sucesso!', 'success');
                formSenha.reset();
              } else {
                mostrarMensagem(dataSenha.message || 'Erro ao alterar senha.', 'error');
              }
              
            } catch (error) {
              console.error('Erro:', error);
              mostrarMensagem('Erro ao conectar com o servidor.', 'error');
            } finally {
              btnSalvar.disabled = false;
              btnSalvar.textContent = originalText;
            }
          });
        }
        
        function mostrarMensagem(texto, tipo) {
          mensagemSenha.textContent = texto;
          mensagemSenha.style.display = 'block';
          mensagemSenha.style.background = tipo === 'success' ? '#d4edda' : '#f8d7da';
          mensagemSenha.style.color = tipo === 'success' ? '#155724' : '#721c24';
          mensagemSenha.style.border = `1px solid ${tipo === 'success' ? '#c3e6cb' : '#f5c6cb'}`;
          
          setTimeout(() => {
            mensagemSenha.style.display = 'none';
          }, 5000);
        }
      })();
      // Logout rápido
      document.getElementById('linkSair')?.addEventListener('click', async (e) => {
        e.preventDefault();
        try { await fetch('/api/auth/logout', { method:'POST', credentials:'include' }); } catch(_) {}
        localStorage.removeItem('care:user');
        location.href = 'index.html';
      });
      // Preencher nome se existir
      (function(){
        const user = JSON.parse(localStorage.getItem('care:user') || 'null');
        if (user?.name) {
          const nome = document.getElementById('nomePerfil');
          if (nome) nome.value = user.name;
          document.querySelectorAll('[data-bind="user-name"]').forEach(el => el.textContent = user.name);
        }
      })();

      // Botão de Ajuda não navega
      document.getElementById('btnAjudaDummy')?.addEventListener('click', (e) => e.preventDefault());
    </script>
  </body>
  </html>
