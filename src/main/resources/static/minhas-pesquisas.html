<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CARE — Minhas Pesquisas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="pesquisas">
    <header class="site-header">
      <a href="index.html" class="brand" aria-label="CARE Home">CARE</a>
      <nav class="main-nav" aria-label="Principal">
        <a href="index.html">Início</a>
        <a href="quem-somos.html" class="requires-guest">Quem somos</a>
        <a href="empresas.html" class="requires-guest">Empresas parceiras</a>
        <a href="seguindo.html" class="requires-auth requires-role-cliente">Seguindo</a>
        <a href="minhas-pesquisas.html" class="requires-auth requires-role-cliente" aria-current="page">Minhas Pesquisas</a>
        <a href="minhas-postagens.html" class="requires-auth requires-role-empresa">Minhas postagens</a>
        <a href="criacao-de-pesquisa.html" class="requires-auth requires-role-empresa">Montar pesquisa</a>
        <a href="login.html" class="requires-guest">Login</a>
        <a href="login.html#cadastro" class="requires-guest">Cadastre-se</a>
      </nav>
      <nav class="user-nav" aria-label="Acesso"></nav>
    </header>

    <main class="client-shell">
      <section class="survey-list">
        <div id="loading" class="muted">Carregando pesquisas...</div>
        <div id="emptyState" class="muted" style="display:none;">Nenhuma pesquisa recebida.</div>
        <div id="listaFormularios" class="survey-grid" style="display:none;"></div>
      </section>
    </main>

    <footer class="site-footer">
      <small>© <span id="ano"></span> CARE — Todos os direitos reservados.</small>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/app.js"></script>
    <script>
      (async function() {
        const loading = document.getElementById('loading');
        const lista = document.getElementById('listaFormularios');
        const empty = document.getElementById('emptyState');
        try {
          const resp = await fetch('/api/formularios/recebidos', { credentials:'include' });
          const data = await resp.json();
          loading.style.display = 'none';
          if (!data.success || !data.formularios || data.formularios.length === 0) {
            empty.style.display = 'block';
            return;
          }
          lista.style.display = 'grid';
          lista.innerHTML = data.formularios.map(f => `
            <article class="card">
              <div class="ph"></div>
              <h3>${escapeHtml(f.titulo || 'Sem título')}</h3>
              <p>${escapeHtml(f.descricao || 'Sem descrição')}</p>
              <a class="card-link" href="responder-formulario.html?id=${f.id}">Responder</a>
            </article>
          `).join('');
        } catch (e) {
          loading.style.display = 'none';
          empty.style.display = 'block';
          empty.textContent = 'Erro ao carregar pesquisas.';
        }
      })();

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
