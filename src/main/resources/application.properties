# H2 Database (banco em arquivo - dados persistem entre reinicializações)
spring.datasource.url=jdbc:h2:file:./data/care_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Carregar dados iniciais (descomente para usar)
#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:data.sql

# H2 Console (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# JDBC URL para console: jdbc:h2:file:./data/care_db

# Configuração de Sessão
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
