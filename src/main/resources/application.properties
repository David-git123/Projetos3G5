# Configuração padrão - Tenta MySQL primeiro, se falhar pode usar H2
# Para usar H2 diretamente, use o perfil 'dev': set SPRING_PROFILES_ACTIVE=dev

# MySQL (comentado - descomente se tiver MySQL configurado)
#spring.datasource.url=jdbc:mysql://localhost:3306/meubancodb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
#spring.datasource.username=meuuser
