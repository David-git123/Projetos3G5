<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Usuário</title>
</head>
<body>

<h2>Cadastro de Usuário</h2>

<!-- Mensagem de sucesso ou erro -->
<p th:if="${mensagem}" th:text="${mensagem}"></p>

<form th:action="@{/cadastro/}" th:object="${pessoa}" method="post">

    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" th:field="*{nome}" placeholder="Digite seu nome" /><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" th:field="*{email}" placeholder="Digite seu email" /><br><br>

    <label for="senha">Senha:</label><br>
    <input type="password" id="senha" th:field="*{senha}" placeholder="Digite sua senha" /><br><br>

    <label for="tipoAcesso">Tipo de Acesso:</label><br>
    <input type="text" id="tipoAcesso" th:field="*{tipoAcesso}" placeholder="Digite o tipo de acesso" /><br><br>

    <button type="submit">Cadastrar</button>
</form>

</body>
</html>
