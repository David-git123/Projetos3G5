<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

<h2>Login de Usuário</h2>

<!-- Mensagem de erro -->
<p th:if="${mensagem}" th:text="${mensagem}"></p>

<form th:action="@{/}" method="post">
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="Digite seu email" required /><br><br>

    <label for="senha">Senha:</label><br>
    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required /><br><br>

    <button type="submit">Entrar</button>
</form>

<p>Não tem cadastro? <a th:href="@{/cadastro/}">Clique aqui</a></p>

</body>
</html>
